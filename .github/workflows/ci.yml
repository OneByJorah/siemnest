name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      # Add your test command, for example: "npm test --prefix app"
      test-command: ""

  ports:
    name: Published ports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Every published port binds to loopback by default
        run: |
          cp .env.example .env
          docker compose config --format json > compose.json
          jq -r '.services | to_entries[] | .key as $s | .value.ports[]? | "\($s) \(.host_ip // "ALL"):\(.published)->\(.target)/\(.protocol)"' compose.json
          jq -e '[.services[].ports[]? | select(.host_ip != "127.0.0.1")] | length == 0' compose.json

  certs:
    name: Generated certificates and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CERT_DIR: wazuh/config/wazuh_indexer_ssl_certs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: No certificates are tracked
        run: test -z "$(git ls-files "$CERT_DIR")"

      - name: Generate, verify the chain, and re-run without changes
        run: |
          ./scripts/generate-certs.sh
          for cert in admin wazuh.indexer wazuh.dashboard; do
            openssl verify -CAfile "$CERT_DIR/root-ca.pem" "$CERT_DIR/$cert.pem"
          done
          before="$(openssl x509 -in "$CERT_DIR/root-ca.pem" -noout -fingerprint -sha256)"
          ./scripts/generate-certs.sh
          test "$before" = "$(openssl x509 -in "$CERT_DIR/root-ca.pem" -noout -fingerprint -sha256)"
          test -z "$(git status --porcelain -- "$CERT_DIR")"

      - name: Generated secrets are complete and untracked
        run: |
          ./scripts/generate-secrets.sh
          if grep -E '=<' .env; then echo 'Unfilled placeholder in .env'; exit 1; fi
          test -z "$(git status --porcelain -- wazuh/config)"
          if git grep -nE 'SecretPassword|MyS3cr37P450r' -- ':!CHANGELOG.md' ':!.github/workflows/ci.yml'; then echo 'Default password still in the repo'; exit 1; fi

      - name: Indexer serves TLS from the generated CA
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose up -d wazuh.indexer
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --cacert "$CERT_DIR/root-ca.pem" \
              --resolve wazuh.indexer:9200:127.0.0.1 https://wazuh.indexer:9200/ || true)"
            if [ "$code" = 200 ] || [ "$code" = 401 ]; then echo "indexer answered $code"; exit 0; fi
            sleep 2
          done
          docker compose logs --tail=100 wazuh.indexer
          echo "Indexer did not answer over TLS"; exit 1

      - name: Graylog truststore builds from the generated CA
        run: docker compose run --rm wazuh-ca-init

      - name: Old and demo passwords are rejected, new ones work
        run: |
          env_get() { grep -E "^$1=" .env | tail -n 1 | cut -d= -f2-; }
          status() { curl -s -o /dev/null -w '%{http_code}' --cacert "$CERT_DIR/root-ca.pem" --resolve wazuh.indexer:9200:127.0.0.1 -u "$1" https://wazuh.indexer:9200/; }
          test "$(status "admin:$(env_get INDEXER_ADMIN_PASSWORD)")" = 200
          test "$(status "kibanaserver:$(env_get DASHBOARD_PASSWORD)")" = 200
          test "$(status admin:SecretPassword)" = 401
          test "$(status kibanaserver:kibanaserver)" = 401
          test "$(status kibanaro:kibanaro)" = 401

      - name: Whole stack comes up on generated certificates and secrets
        run: |
          env_get() { grep -E "^$1=" .env | tail -n 1 | cut -d= -f2-; }
          API_PASSWORD="$(env_get WAZUH_API_PASSWORD)"
          docker compose up -d --build
          wait_for() {
            for i in $(seq 1 180); do
              if "${@:2}" >/dev/null 2>&1; then echo "$1 ready after $((i * 5))s"; return 0; fi
              sleep 5
            done
            echo "$1 did not come up"; docker compose ps; docker compose logs --tail=60; return 1
          }
          manager() { curl -fsk -u "wazuh-wui:$API_PASSWORD" -X POST https://127.0.0.1:55000/security/user/authenticate; }
          dashboard() { curl -fsk https://127.0.0.1:443/app/login; }
          graylog() { curl -fs http://127.0.0.1:9091/api/system/lbstatus | grep -q ALIVE; }
          wait_for "Wazuh manager API" manager
          wait_for "Wazuh dashboard" dashboard
          wait_for "Graylog" graylog
          docker compose exec -T wazuh.manager filebeat test output
