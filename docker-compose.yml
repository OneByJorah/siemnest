name: siemnest

include:
  - wazuh/docker-compose.yml

# One integrated stack: Graylog (log management) + Wazuh (XDR/SIEM) share a
# single OpenSearch data plane, and the AI analyst correlates events from both.

services:
  # --------------------------------------------------------------- Graylog side
  mongodb:
    image: mongo:7.0
    container_name: siemnest-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Graylog stores its indices on the SAME shared OpenSearch data plane
  # (the Wazuh indexer) - one datastore for the whole stack.
  graylog:
    image: graylog/graylog:6.1
    container_name: siemnest-graylog
    restart: unless-stopped
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_HTTP_EXTERNAL_URI:-http://127.0.0.1:9091/}
      GRAYLOG_ELASTICSEARCH_HOSTS: https://admin:SecretPassword@wazuh.indexer:9200
      GRAYLOG_ELASTICSEARCH_TLS_CA_FILE: /etc/graylog/root-ca.pem
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_SERVER_JAVA_OPTS: -Djavax.net.ssl.trustStore=/shared/cacerts -Djavax.net.ssl.trustStorePassword=changeit
    entrypoint: /usr/bin/tini -- sh -c "keytool -importcert -noprompt -alias siemnest-ca -file /etc/graylog/root-ca.pem -keystore $$JAVA_HOME/lib/security/cacerts -storepass changeit 2>/dev/null || true; wait-for-it wazuh.indexer:9200 -- /docker-entrypoint.sh"
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/etc/graylog/root-ca.pem:ro
      - graylog_truststore:/shared
    ports:
      - "127.0.0.1:9091:9000"
      - "127.0.0.1:1514:1514/udp"
      - "127.0.0.1:5044:5044"
    depends_on:
      mongodb:
        condition: service_healthy
      wazuh-ca-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9091/api/system/lbstatus | grep -q ALIVE"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # One-shot: build a JVM truststore (default cacerts + the indexer CA) for Graylog.
  wazuh-ca-init:
    image: graylog/graylog:6.1
    user: root
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/tmp/root-ca.pem:ro
      - graylog_truststore:/shared
    entrypoint: sh -c "cp /opt/java/openjdk/lib/security/cacerts /shared/cacerts && keytool -importcert -noprompt -alias siemnest-ca -file /tmp/root-ca.pem -keystore /shared/cacerts -storepass changeit"
    restart: "no"
    networks:
      - default

  # ------------------------------------------------------------------ AI layer
  # The AI analyst reads events from BOTH tools through the shared data plane,
  # correlates them with an LLM, and publishes verdicts to the portal.
  ai-analyst:
    build: ./ai-analyst
    image: ghcr.io/onebyjorah/siemnest-ai:latest
    container_name: siemnest-ai
    restart: unless-stopped
    environment:
      AI_PORT: "8090"
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      OPENSEARCH_URL: https://wazuh.indexer:9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: SecretPassword
      GRAYLOG_API: http://graylog:9000/api
      GRAYLOG_TOKEN: ${GRAYLOG_API_TOKEN:-}
      POLL_SECONDS: "60"
    ports:
      - "127.0.0.1:8091:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8090/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------- Portal
  portal:
    build: ./portal
    image: ghcr.io/onebyjorah/siemnest:latest
    container_name: siemnest-portal
    restart: unless-stopped
    environment:
      PORTAL_PORT: "8080"
      GRAYLOG_URL: ${GRAYLOG_HTTP_EXTERNAL_URI:-http://127.0.0.1:9000}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://127.0.0.1:443}
      AI_URL: ${AI_URL:-http://127.0.0.1:8090}
    ports:
      - "127.0.0.1:8082:8080"


volumes:
  mongo_data:
    name: siemnest_mongo_data
  graylog_truststore:
    name: siemnest_graylog_truststore
